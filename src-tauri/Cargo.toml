[package]
name = "pawn"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "pawn"

[[bin]]
name = "pawn"
path = "src/main.rs"

[[bin]]
name = "generate_bindings"
path = "src/bin/generate_bindings.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.7.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
anyhow = "1.0.98"
thiserror = "2.0.12"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
ts-rs = "11.1.0"
specta = { version = "2.0.0-rc.22", features = ["serde", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-utils = "2.4.0"
uuid = { version = "1.17.0", features = ["v4"] }
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "uuid", 
    "time",
    "runtime-tokio",
    "macros",
    "migrate",
], default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
rand = "0.9"
csv = "1.3"
tokio = { version = "1.48", features = ["full"] }
# Export functionality
printpdf = "0.7"
rust_xlsxwriter = "0.92"
# Settings system dependencies
serde_yaml = "0.9"
tauri-plugin-mcp-bridge = "0.9"
