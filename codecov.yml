codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 70%
        threshold: 1%
        if_ci_failed: error

    patch:
      default:
        target: 40%
        threshold: 5%
        if_ci_failed: error
        # Lower target accounts for Tauri architectural limitation:
        # Tauri command wrappers cannot be unit tested due to State<T> having private fields
        # These are thin delegates to tested service layer logic

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "src-tauri/src/main.rs"
  - "src-tauri/target/**"
  - "**/*.test.rs"
  - "**/tests/**"
