name: Frontend Quality Gates (Parallelized)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-test.yml'

jobs:
  # Quick format and lint checks (fastest feedback)
  format-and-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check Prettier formatting
      run: pnpm format:check

    - name: Run ESLint
      run: pnpm lint

    - name: Run TypeScript type checking
      run: pnpm type-check

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run unit tests
      run: pnpm vitest --run --reporter=verbose
      env:
        CI: true
        VITEST_MAX_THREADS: 4

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run integration tests
      run: echo "Frontend integration tests would run here (currently using Rust integration tests)"
      env:
        CI: true

  # Build and bundle analysis
  build-and-bundle:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          pkg-config \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build for production
      run: pnpm build

    - name: Check bundle size
      run: |
        echo "Bundle size analysis would run here"
        # pnpm bundlesize

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        retention-days: 7

  # E2E tests (separate job due to different dependencies)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [format-and-lint, build-and-bundle]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          pkg-config \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      run: pnpm playwright install --with-deps

    - name: Build application
      run: pnpm build

    - name: Run E2E tests
      run: |
        # pnpm test:e2e
        echo "E2E tests would run here"

  # Summary job
  frontend-summary:
    name: Frontend Summary
    runs-on: ubuntu-latest
    needs: [format-and-lint, unit-tests, integration-tests, build-and-bundle, e2e-tests]
    if: always()
    steps:
    - name: Check all jobs status
      env:
        FORMAT_RESULT: ${{ needs.format-and-lint.result }}
        UNIT_RESULT: ${{ needs.unit-tests.result }}
        INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        BUILD_RESULT: ${{ needs.build-and-bundle.result }}
        E2E_RESULT: ${{ needs.e2e-tests.result }}
      run: |
        echo "Frontend Quality Gates Summary"
        echo "================================"
        echo "Format & Lint: $FORMAT_RESULT"
        echo "Unit Tests: $UNIT_RESULT"
        echo "Integration Tests: $INTEGRATION_RESULT"
        echo "Build & Bundle: $BUILD_RESULT"
        echo "E2E Tests: $E2E_RESULT"

        if [[ "$FORMAT_RESULT" == "success" &&
              "$UNIT_RESULT" == "success" &&
              "$INTEGRATION_RESULT" == "success" &&
              "$BUILD_RESULT" == "success" &&
              "$E2E_RESULT" == "success" ]]; then
          echo "All frontend quality gates passed!"
          exit 0
        else
          echo "Some frontend quality gates failed!"
          exit 1
        fi
