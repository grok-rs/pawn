name: Backend Quality Gates (Parallelized)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/backend-test.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quick format and lint checks (runs first, fastest feedback)
  format-and-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    # Optimized: Use Swatinem/rust-cache for 3-5min faster builds
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri -> target"
        cache-on-failure: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev pkg-config libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Check Rust formatting
      run: |
        cd src-tauri
        cargo fmt --check

    - name: Run Rust linting
      run: |
        cd src-tauri
        cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Rust type checking
      run: |
        cd src-tauri
        cargo check --all-targets --all-features

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # Optimized: Use Swatinem/rust-cache (shared across jobs)
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri -> target"
        cache-on-failure: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev pkg-config libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Run tests
      run: |
        cd src-tauri
        cargo test

  # Integration tests and database operations
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # Optimized: Shared Rust cache
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri -> target"
        cache-on-failure: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev pkg-config libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Run integration tests
      run: |
        cd src-tauri
        cargo test --test integration --release
        echo "Integration tests completed"

    - name: Validate database migrations
      run: |
        cd src-tauri
        cargo test migration_ --release
        echo "Database migration validation completed"

    - name: Test command contracts
      run: |
        cd src-tauri
        cargo test command_ --lib --release
        echo "Command contract tests completed"

  # Performance and memory tests
  performance-tests:
    name: Performance & Memory Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # Optimized: Shared Rust cache
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri -> target"
        cache-on-failure: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev pkg-config libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Run performance benchmarks
      run: |
        cd src-tauri
        cargo bench --bench pairing_performance --message-format=json > benchmark_results.json
        echo "Performance benchmarks completed"

    - name: Run memory leak detection
      run: |
        cd src-tauri
        cargo test memory_leak_ --release
        echo "Memory leak detection completed"

    - name: Performance regression check
      run: |
        cd src-tauri
        echo "Checking for performance regressions..."

        # Extract benchmark results
        if [ -f benchmark_results.json ]; then
          echo "Pairing performance check would run here"
        fi

  # Final summary job that depends on all others
  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [format-and-lint, unit-tests, integration-tests, performance-tests]
    if: always()
    steps:
    - name: Check all jobs status
      env:
        FORMAT_RESULT: ${{ needs.format-and-lint.result }}
        UNIT_RESULT: ${{ needs.unit-tests.result }}
        INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        PERFORMANCE_RESULT: ${{ needs.performance-tests.result }}
      run: |
        echo "Backend Quality Gates Summary"
        echo "================================"
        echo "Format & Lint: $FORMAT_RESULT"
        echo "Unit Tests: $UNIT_RESULT"
        echo "Integration Tests: $INTEGRATION_RESULT"
        echo "Performance Tests: $PERFORMANCE_RESULT"

        if [[ "$FORMAT_RESULT" == "success" &&
              "$UNIT_RESULT" == "success" &&
              "$INTEGRATION_RESULT" == "success" &&
              "$PERFORMANCE_RESULT" == "success" ]]; then
          echo "All quality gates passed!"
          exit 0
        else
          echo "Some quality gates failed!"
          exit 1
        fi
